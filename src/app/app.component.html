<nav *ngIf="currentUrl !== '/login'" class="navbar glass-card">
  <div class="container nav-content">
    <div class="brand">
      <img src="/logo.png" alt="Logo" class="brand-logo" />
    </div>
    <div class="nav-right">
      <span class="user-greeting" *ngIf="currentUser">Hello, {{ currentUser.name }}</span>
      <div class="nav-links">
        <button *ngIf="currentUser" (click)="openChampionModal()" class="champion-pick-btn"
          [class.no-pick]="!currentUser?.championPrediction">
          <span class="trophy-emoji">🏆</span>
          <img *ngIf="currentUser?.championPrediction" [src]="getFlag(currentUser.championPrediction)"
            class="nav-flag-icon" />
          <span class="btn-text">{{ currentUser?.championPrediction ? currentUser.championPrediction : 'Predict
            Champion' }}</span>
        </button>
        <a routerLink="/leaderboard" routerLinkActive="active" class="nav-link">Leaderboard</a>
        <a routerLink="/matches" routerLinkActive="active" class="nav-link">Match Center</a>
        <a routerLink="/admin" routerLinkActive="active" class="nav-link" *ngIf="currentUser?.isAdmin">Admin Panel</a>
        <button *ngIf="currentUser" (click)="toggleAudio()" class="audio-control-btn" [class.playing]="isPlaying">
          <span class="audio-wave" *ngIf="isPlaying">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span class="music-icon">{{ isPlaying ? '🔊' : '🔇' }}</span>
          <span class="btn-text">Wavin' Flag</span>
        </button>
        <button (click)="logout()" class="btn btn-secondary"
          style="padding: 6px 14px; font-size: 0.85rem; border-radius: 20px; margin-left: 8px; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);">Logout</button>
      </div>
    </div>
  </div>
</nav>

<main class="container main-content">
  <router-outlet></router-outlet>
</main>

<!-- Champion Prediction Modal -->
<div class="modal-overlay" *ngIf="isChampionModalOpen">
  <div class="modal-content champion-modal-card glass-card">
    <div class="modal-header">
      <h3>Predict World Cup Champion</h3>
      <button class="close-btn" (click)="closeChampionModal()">&times;</button>
    </div>
    <div class="modal-body scrollable-body">
      <p class="modal-instruction">Select the country you predict will win the World Cup 🏆</p>
      
      <div class="modal-warning">
        <span class="warning-icon">⚠️</span>
        <span class="warning-text">After Group Stage is over, you cannot change your prediction.</span>
      </div>

      <div class="groups-grid">
        <div class="group-card" *ngFor="let group of groups | keyvalue">
          <h4 class="group-title">{{ group.key }}</h4>
          <div class="teams-list">
            <div *ngFor="let team of group.value" class="team-option" [class.selected]="selectedChampion === team"
              (click)="selectTeam(team)">
              <img [src]="getFlag(team)" [alt]="team" class="modal-flag-icon" />
              <span class="team-name">{{ team }}</span>
              <span class="check-badge" *ngIf="selectedChampion === team">✓</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="closeChampionModal()">Cancel</button>
      <button class="btn btn-primary btn-save" (click)="saveChampionSelection()">Save Prediction</button>
    </div>
  </div>
</div>
